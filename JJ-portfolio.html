/* Each step on a title-bar light is two screen pixels. */
.window {
  background: #fafafb;
  border: 2px solid #ccd7e1;
  box-shadow: 4px 4px 0 #26374955;
}
.titlebar { background: #eff4f8; border-color: #dce3eb; }
.works-toolbar, .window-status { background: #f7f8fb; border-color: #dce3eb; color: #637189; }
.works-scroll, .detail-body, :is(#project-tree,#works-project-tree) { background: #fafafb; }
:is(#project-tree,#works-project-tree) { border-color: #dce3eb; }
.project-card { background: #f6f7f9; border-color: #dce3eb; }
.project-category, .project-meta, .window .back, .copy-btn, .next-project {
  font-family: var(--mono), sans-serif;
}
.window-controls { gap: 0; left: 10px; }
.window .control {
  --step-edge: polygon(30% 0,70% 0,70% 10%,85% 10%,85% 25%,100% 25%,100% 75%,85% 75%,85% 90%,70% 90%,70% 100%,30% 100%,30% 90%,15% 90%,15% 75%,0 75%,0 25%,15% 25%,15% 10%,30% 10%);
  width: 24px; height: 26px;
  position: relative; isolation: isolate;
  background: transparent; border: 0; border-radius: 0; box-shadow: none;
  font: 12px var(--mono); color: transparent;
}
.window .control::before, .window .control::after {
  content: ''; position: absolute; z-index: -1;
  clip-path: var(--step-edge);
}
.window .control::before { inset: 3px 2px; background: #17141a; }
.window .control::after {
  inset: 5px 4px;
  background: linear-gradient(to bottom, var(--glint) 0 2px,var(--lamp) 2px calc(100% - 2px),var(--shade) calc(100% - 2px));
}
.control.close { --lamp: #e74242; --glint: #ff9690; --shade: #bd2734; }
.control.minimize { --lamp: #f4c91f; --glint: #fff191; --shade: #d99d13; }
.control.expand { --lamp: #66c75c; --glint: #adf396; --shade: #469946; }
.window .control:is(:hover,:focus-visible) { color: #17141a; }
button:active { translate: 1px 1px; }
.project-card:active, .dock button:active, .back:active, :is(#project-tree,#works-project-tree) button:active {
  background: #ccd9e8; box-shadow: inset 2px 2px 0 #8896a9;
}
@media (any-pointer: fine) {
  html, body, body *, dialog::backdrop {
    cursor: url('JJ-portfolio-assets/assets/pointer.svg') 0 0, default;
  }
  html:active, body:active *, dialog:active::backdrop {
    cursor: url('JJ-portfolio-assets/assets/pointer-down.svg') 2 2, default;
  }
}

.about-actions { margin: 30px 0 0; }

#detail-title:focus { outline: none; }
.about-works-button {
  --corners: polygon(0 4px,2px 4px,2px 2px,4px 2px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px));
  display: inline-flex;
  align-items: center;
  position: relative;
  isolation: isolate;
  padding: 11px 16px;
  border: 0;
  background: transparent;
  filter: drop-shadow(2px 2px 0 #7d8a9c);
}
.about-works-button::before, .about-works-button::after {
  content: '';
  position: absolute;
  z-index: -1;
  clip-path: var(--corners);
}
.about-works-button::before { inset: 0; background: #24334b; }
.about-works-button::after {
  inset: 2px;
  background: #e5ecf5;
  box-shadow: inset 2px 2px white, inset -2px -2px #b7c2d1;
}
.about-works-button:hover::after { background: #d2e4fa; }
.about-works-button:active { translate: 2px 2px; filter: none; }
.about-works-button:active::after { box-shadow: inset 2px 2px #94a4bb; }
.about-works-label {
  width: 120px; height: 16px;
  background: url('JJ-portfolio-assets/assets/folder.svg') left center/18px auto no-repeat,
              url('JJ-portfolio-assets/assets/works-label.svg') right center/96px 16px no-repeat;
  image-rendering: pixelated;
}

/* About JJ: original portrait on the left, supplied resume on the right. */
.detail-dialog.is-small.is-about { width:min(1120px,94vw); height:92dvh; max-height:94dvh; }
.detail-dialog.is-about .detail-body { flex:1; min-height:0; }
.detail-dialog.is-about .detail-scroll { max-height:none; }

.is-about .about-actions { margin-top:24px; }
.about-resume { display:grid; grid-template-columns:minmax(160px,28%) minmax(0,1fr); align-items:start; gap:32px; margin-top:36px; padding-top:32px; border-top:1px solid #dce3eb; }
.resume-photo { margin:0; }
.resume-photo img { display:block; width:100%; height:auto; border:1px solid #dce3eb; }

.resume-details { margin:0; }
.resume-details>div { display:grid; grid-template-columns:72px minmax(0,1fr); gap:14px; padding:0 0 10px; }
.resume-details dt { color:#637189; }
.resume-details dd { margin:0; overflow-wrap:anywhere; }
.resume-education>span { display:flex; flex-wrap:wrap; column-gap:16px; row-gap:0; }
.resume-education b { font-weight:600; }
.resume-details a:hover { text-decoration:underline; text-underline-offset:3px; }
.resume-experience { margin-top:22px; }
.resume-experience h3 { font:600 16px/1.5 var(--sans); color:#111a30; margin:0 0 22px; }
.resume-job+.resume-job { margin-top:28px; padding-top:24px; border-top:1px solid #e0e5ed; }
.resume-date { font-size:13px; font-weight:600; color:#637189; }
.resume-job h4 { font:600 15px/1.7 var(--sans); color:#111a30; margin:4px 0 10px; }
.is-about .resume-job p { font:14px/1.95 var(--sans); color:#535b69; margin:0; }

@media(max-width:650px) {
  .is-about .about-content { padding:26px 20px 30px; }
  .about-resume { grid-template-columns:minmax(80px,27%) minmax(0,1fr); gap:16px; margin-top:28px; padding-top:24px; }
  .resume-copy,.is-about .resume-job p { font-size:12px; }
  .resume-details>div { display:block; padding-bottom:10px; }
  .resume-details dt { font-size:11px; margin-bottom:2px; }
  .resume-education>span { display:block; margin-bottom:8px; }
  .resume-education>span>span { display:block; }
  .resume-education b,.resume-date { font-size:11px; }
  .resume-experience h3 { font-size:15px; margin-bottom:16px; }
  .resume-job h4 { font-size:13px; }
}

/* The Works frame owns both its list and its project views. */
.works-window [hidden] { display:none!important; }
.works-detail { min-height:0; flex:1; }
.works-detail .detail-scroll { background:#fafafb; }
.works-window.has-project .works-toolbar>span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@media(max-width:650px) {

  .works-detail #works-project-tree button { width:100%; white-space:normal; overflow-wrap:anywhere; padding:10px 4px; gap:6px; }
}

function startSummerDemo(root) {
  const screen = root.querySelector('.ss-display');
  const toggle = root.querySelector('[data-demo-toggle]');
  let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let visible = false;
  let frame = 0;
  let previousTime = 0;
  let position = 0;
  let direction = 1;
  let holdUntil = 0;

  function step(now) {
    const max = screen.scrollHeight - screen.clientHeight;
    const elapsed = previousTime ? Math.min(50, now - previousTime) : 0;
    previousTime = now;
    if (max > 0 && now >= holdUntil) {
      position += direction * max * elapsed / 18000;
      if (position <= 0 || position >= max) {
        position = Math.min(max, Math.max(0, position));
        direction = position >= max ? -1 : 1;
        holdUntil = now + 1200;
      }
      screen.scrollTop = position;
    }
    frame = requestAnimationFrame(step);
  }

  function synchronize() {
    cancelAnimationFrame(frame);
    previousTime = 0;
    position = screen.scrollTop;
    toggle.setAttribute('aria-label', playing ? '暂停演示' : '播放演示');
    toggle.setAttribute('aria-pressed', String(playing));
    if (playing && visible && !document.hidden) frame = requestAnimationFrame(step);
  }
  function manualScroll() {
    if (!playing) return;
    playing = false;
    synchronize();
  }
  ['wheel', 'pointerdown', 'keydown'].forEach(type => screen.addEventListener(type, manualScroll, { passive: true }));
  toggle.addEventListener('click', () => { playing = !playing; synchronize(); });
  const observer = new IntersectionObserver(([entry]) => {
    visible = entry.isIntersecting;
    holdUntil = performance.now() + 800;
    synchronize();
  }, {root, threshold: 0.15});
  observer.observe(screen);
  document.addEventListener('visibilitychange', synchronize);
  synchronize();
  return () => {
    observer.disconnect();
    cancelAnimationFrame(frame);
    document.removeEventListener('visibilitychange', synchronize);
  };
}

      const index=progress*800,lo=Math.floor(index),fraction=index-lo;
      const a=samples[lo],b=samples[lo+1];
      const x=(a.x+(b.x-a.x)*fraction)/SOCIAL_CANVAS.width*width;
      const y=(a.y+(b.y-a.y)*fraction)/SOCIAL_CANVAS.height*height;
      card.style.transform=`translate3d(${x}px,${y}px,0) translate(-50%,-50%)`;
      card.style.zIndex=String(20+Math.round(20*(1+Math.cos(progress*Math.PI*8))));
    });
  }
  function step(now) {
    if(disposed)return;
    const elapsed=previous?Math.min(64,now-previous):0;previous=now;
    phase=(phase+elapsed/100000)%1;
    render();frame=requestAnimationFrame(step);
  }
  function synchronize() {
    cancelAnimationFrame(frame);frame=0;previous=0;
    const running=visible&&!document.hidden&&!preference.matches&&!held.size&&!disposed;
    stage.dataset.running=String(running);
    if(running)frame=requestAnimationFrame(step);
  }
  cards.forEach(card=>{
    let pointer=false,focused=false;
    function update() {
      const active=pointer||focused;
      if(active)held.add(card);else held.delete(card);
      card.classList.toggle('is-highlighted',active);
      card.setAttribute('aria-expanded',String(active));
      synchronize();
    }
    card.addEventListener('pointerenter',()=>{pointer=true;update();},{signal:events.signal});
    card.addEventListener('pointerleave',()=>{pointer=false;update();},{signal:events.signal});
    card.addEventListener('focus',()=>{focused=true;update();},{signal:events.signal});
    card.addEventListener('blur',()=>{focused=false;update();},{signal:events.signal});
  });
  const resize=new ResizeObserver(([entry])=>{width=entry.contentRect.width;height=entry.contentRect.height;render();});
  resize.observe(stage);
  const observer=new IntersectionObserver(([entry])=>{visible=entry.isIntersecting;synchronize();},{root,threshold:.05});
  observer.observe(stage);
  document.addEventListener('visibilitychange',synchronize,{signal:events.signal});
  preference.addEventListener('change',synchronize,{signal:events.signal});
  render();stage.dataset.ready='true';synchronize();
  return ()=>{disposed=true;cancelAnimationFrame(frame);observer.disconnect();resize.disconnect();events.abort();held.clear();};
}

function route(){
 if(stopSocialDemo){stopSocialDemo();stopSocialDemo=undefined;}
 if (stopSummerDemo) {
   stopSummerDemo();
   stopSummerDemo = undefined;
 }
 const hash=location.hash.slice(1);
 const inWorks=hash==='works'||hash.startsWith('work/');
 worksWindow.classList.toggle('is-hidden',!inWorks);
 if(hash.startsWith('work/'))openProject(hash.slice(5));
 else if(hash==='works')showWorksList();
